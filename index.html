<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Tracking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0b1020; --panel:#121a2e; --panel2:#18223a; --line:#24304d; --text:#e6ebf5; --muted:#8a96b2;
  --accent:#4f8cff; --green:#22c38e; --red:#ff5d6c; --amber:#f5b544; --violet:#a78bfa;
  --radius:12px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:#0e1529;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#22c38e);display:grid;place-items:center;font-weight:700;color:#06101f}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav .sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5b678a;margin:16px 10px 6px}
.nav .ct{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:0 7px}
.side-foot{margin-top:18px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-linked{background:#064e3b;color:#34d399;border:1px solid #059669;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill-disconnected{background:#450a0a;color:#f87171;border:1px solid #dc2626;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-test{background:#1d2c55;color:#8fb3ff}.p-live{background:#0f3a2d;color:#4fe0ad}.p-watch{background:#3d3015;color:#ffc861}.p-stop{background:#3d1820;color:#ff8792}
.p-high{background:#3d1820;color:#ff8792}.p-med{background:#3d3015;color:#ffc861}.p-low{background:#232c45;color:#aab6d3}
.p-pass{background:#0f3a2d;color:#4fe0ad}.p-fail{background:#3d1820;color:#ff8792}
.grid{display:grid;gap:14px}
.k6{grid-template-columns:repeat(6,1fr)}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--muted);font-weight:400}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:4px}
.kpi .h{color:var(--muted);font-size:11.5px;margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;white-space:nowrap;border-bottom:1px solid #1c2640;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#16203a}
td.n,th.n{text-align:right;font-family:var(--mono)}
.tbl-wrap{overflow:auto;max-height:560px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:#3a4a73}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#ff8792}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-connect{background:#059669 !important;border-color:#10b981 !important;color:#fff !important;font-weight:600}
.btn-connect:hover{background:#047857 !important}
.btn-disconnect{background:#7f1d1d !important;border-color:#ef4444 !important;color:#fecaca !important;font-weight:600}
.btn-disconnect:hover{background:#991b1b !important;color:#fff !important}
.btn-relink{background:#1e3a8a !important;border-color:#3b82f6 !important;color:#bfdbfe !important;font-weight:600}
.btn-relink:hover{background:#1d4ed8 !important;color:#fff !important}
input,select,textarea{background:#0d1428;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
label.f input,label.f select{color:var(--text);font-size:14px;min-width:0;width:100%}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.flow{display:flex;gap:10px;align-items:stretch}
.flow .st{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.flow .st b{display:block;font-size:13px}.flow .st span{font-size:12px;color:var(--muted)}
.flow .st .no{font-family:var(--mono);color:var(--accent);font-weight:700}
.flagtxt{font-size:12.5px;white-space:normal;min-width:220px}
.chip{display:inline-block;background:#1b2542;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11.5px;margin:2px 3px 2px 0}
.chip.bad{border-color:#6b2532;color:#ff8792}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,15,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(820px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 14px;font-size:17px}
.toast{position:fixed;bottom:20px;right:20px;background:#13213f;border:1px solid var(--accent);padding:10px 14px;border-radius:10px;z-index:60;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1.6;border-radius:5px;font-size:10.5px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--mono)}
.cal .hd{aspect-ratio:auto;color:var(--muted);font-family:Inter}
.bar{height:8px;background:#1b2542;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;background:#0d1428;border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{background:none;border:0;color:var(--muted);padding:5px 11px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--text)}
.note{background:#101a33;border:1px dashed #33467a;border-radius:10px;padding:12px;color:#b5c2e0;font-size:12.5px}
pre.code{background:#0a1022;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;color:#c5d2f0;max-height:340px}
.checklist td:last-child{text-align:right}
.login{min-height:100vh;display:grid;place-items:center}
.login .card{width:360px}
@media (max-width:1100px){.k6{grid-template-columns:repeat(3,1fr)}.c21,.k2{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.k4,.k3,.k6{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   TRADER TRACKING SYSTEM — tracking only, never places orders.
   Data layer: everything goes through `Store` + `API`. For live
   deployment set Settings → Data source = Live API and implement the
   endpoints listed in Settings → API (read-only broker trade books).
   ===================================================================== */

// ---------- utilities ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = (n, d=0) => (n<0?'−':'') + '₹' + Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:d});
const inrS = n => { const a=Math.abs(n), s=n<0?'−':(n>0?'+':''); return a>=1e7? s+'₹'+(a/1e7).toFixed(2)+' Cr' : a>=1e5? s+'₹'+(a/1e5).toFixed(2)+' L' : s+'₹'+Math.round(a).toLocaleString('en-IN'); };
const pct = (n,d=0) => isFinite(n)? n.toFixed(d)+'%' : '—';
const cls = n => n>0?'pos':(n<0?'neg':'');
const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
const fromMin = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const uid = p => p + Math.random().toString(36).slice(2,8).toUpperCase();
const TODAY = new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
function dstr(d){ return d.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return dstr(d); }
function isWeekday(s){ const g=new Date(s+'T00:00:00Z').getUTCDay(); return g>0&&g<6; }
function tradingDaysBetween(a,b){ let c=0; for(let s=a; s<=b; s=addDays(s,1)) if(isWeekday(s)) c++; return c; }
function nthTradingDay(start,n){ let s=start,c=isWeekday(s)?1:0; while(c<n){ s=addDays(s,1); if(isWeekday(s)) c++; } return s; }
function fmtDate(s){ const d=new Date(s+'T00:00:00Z'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',timeZone:'UTC'}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

// seeded RNG for repeatable demo data
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

// ---------- default settings ----------
const DEFAULT_SETTINGS = {
  dataSource:'live', apiBase:'/api', apiKey:'',
  lotSize:30, strikeStep:100, testDays:30, extendDays:15,
  pass:{ ruleFollow:95, highFlags:2, maxDDpct:10, accuracy:50, rr:1.5, pf:1.3 },
  capitalSteps:'₹5 L → ₹15 L → ₹50 L',
  alerts:{ telegram:'', whatsapp:'', email:'', onHigh:true, dailySummary:true, summaryTime:'15:35' }
};
const DEFAULT_RULES = { instrument:'BANKNIFTY', expiry:'Monthly', strikeMode:'ITM', strikeDist:1, side:'BUY', product:'MIS',
  timeFrom:'09:20', timeTo:'14:30', maxTradesDay:4, maxLots:3, slPerLot:2000, dailyLoss:10000, hedge:false, source:'ANY' };

// ---------- demo data ----------
function buildDemo(){
  const traders = [
    {id:'TR-001',name:'Trader A',ra:'RA Group A',style:'Manual',holding:'Intraday',segment:'Bank Nifty options',testCapital:300000,status:'Testing',start:addDays(TODAY,-41)},
    {id:'TR-002',name:'Trader B',ra:'RA Group A',style:'Manual',holding:'Intraday',segment:'Bank Nifty options',testCapital:300000,status:'Testing',start:addDays(TODAY,-41)},
    {id:'TR-003',name:'Trader C',ra:'RA Group B',style:'Manual',holding:'Intraday',segment:'Bank Nifty options',testCapital:300000,status:'Testing',start:addDays(TODAY,-41)},
    {id:'TR-004',name:'Trader D',ra:'RA Group B',style:'Algo',holding:'Intraday',segment:'Bank Nifty options',testCapital:300000,status:'Testing',start:addDays(TODAY,-41)},
    {id:'TR-005',name:'Trader E',ra:'RA Group A',style:'Algo',holding:'Intraday',segment:'Bank Nifty options',testCapital:300000,status:'Testing',start:addDays(TODAY,-24)},
  ];
  const accounts = [
    {id:'AC-01',name:'Account 1',broker:'Angel One',trader:'TR-001'},
    {id:'AC-02',name:'Account 2',broker:'Dhan',trader:'TR-001'},
    {id:'AC-03',name:'Account 3',broker:'Zerodha',trader:'TR-003'},
    {id:'AC-04',name:'Account 4',broker:'Fyers',trader:'TR-004'},
    {id:'AC-05',name:'Account 5',broker:'Angel One',trader:'TR-002'},
    {id:'AC-06',name:'Account 6',broker:'Upstox',trader:'TR-005'},
    {id:'AC-07',name:'Account 7',broker:'Angel One',trader:'TR-001'},
  ];
  const rules = {};
  traders.forEach(t=>rules[t.id]={...DEFAULT_RULES});
  rules['TR-003'] = {...DEFAULT_RULES, product:'ANY', maxTradesDay:3};
  rules['TR-004'] = {...DEFAULT_RULES, strikeMode:'ATM', strikeDist:0, source:'Algo', maxTradesDay:5};
  rules['TR-005'] = {...DEFAULT_RULES, source:'Algo', maxTradesDay:4};
  rules['TR-003'].product='MIS'; // C's rule says intraday only — he breaks it
  const ruleLog = traders.map(t=>({trader:t.id,at:t.start+' 10:00',by:'admin',change:'Rule book created'}));
  ruleLog.push({trader:'TR-004',at:addDays(TODAY,-30)+' 16:10',by:'admin',change:'Max trades/day 4 → 5'});

  // profile per trader: winRate, avgWin, avgLoss, tpd, violation prob
  const prof = {
    'TR-001':{w:.56,aw:3300,al:2150,tpd:3.4,v:.012,accts:['AC-01','AC-02','AC-07']},
    'TR-002':{w:.58,aw:2500,al:2050,tpd:4.2,v:.11,accts:['AC-05']},
    'TR-003':{w:.41,aw:2600,al:2900,tpd:3.0,v:.20,accts:['AC-03']},
    'TR-004':{w:.49,aw:3900,al:1850,tpd:3.6,v:.08,accts:['AC-04']},
    'TR-005':{w:.55,aw:2400,al:1750,tpd:3.0,v:.00,accts:['AC-06']},
  };
  const R = rng(20261113), trades=[];
  let spot = 51800;
  const days=[]; for(let s=addDays(TODAY,-45); s<=TODAY; s=addDays(s,1)) if(isWeekday(s)) days.push(s);
  const spotByDay={}; days.forEach(d=>{ spot += (R()-.48)*380; spotByDay[d]=spot; });
  traders.forEach(t=>{
    const p=prof[t.id], rl=rules[t.id];
    days.filter(d=>d>=t.start).forEach(d=>{
      let n=Math.min(rl.maxTradesDay, Math.max(1,Math.round(p.tpd + (R()-.5)*2.4)));
      let violCount = 0;
      for(let i=0;i<n;i++){
        const sp = spotByDay[d] + (R()-.5)*260;
        const atm = Math.round(sp/100)*100;
        const ce = R()>.5;
        let dist = rl.strikeMode==='ATM'?0:rl.strikeDist;
        let strike = ce? atm - dist*100 : atm + dist*100;
        let tmin = toMin(rl.timeFrom) + Math.floor(R()*(toMin(rl.timeTo)-toMin(rl.timeFrom)));
        let lots = 1+Math.floor(R()*rl.maxLots), product='MIS', exitDate=d;
        let win = R()<p.w;
        let gross = win? p.aw*(0.4+R()*1.2) : -p.al*(0.4+R()*1.0);
        gross = Math.max(gross, -rl.slPerLot*lots*0.95);
        const doViol = R()<p.v && violCount<2;
        if(doViol){
          violCount++;
          const k=Math.floor(R()*5);
          if(k===0){ strike = ce? atm+200 : atm-200; }
          else if(k===1){ tmin = toMin(rl.timeTo)+5+Math.floor(R()*35); }
          else if(k===2){ gross = -(rl.slPerLot+600+R()*1800)*lots; win=false; }
          else if(k===3){ lots = rl.maxLots+1; }
          else { product='NRML'; exitDate = nextTradingDay(d,days); }
        }
        const lotSize=30, qty=lots*lotSize;
        const entry = Math.round((260+R()*240)*20)/20;
        const exit = Math.round((entry + gross/qty)*20)/20;
        const hold = 6+Math.floor(R()*80);
        const charges = Math.round(45+lots*22+R()*15);
        trades.push({ id:uid('T'), date:d, time:fromMin(tmin), trader:t.id, account:p.accts[Math.floor(R()*p.accts.length)],
          symbol:'BANKNIFTY', strike, opt: ce?'CE':'PE', expiryType:'Monthly', expiry:'', side:'BUY', lots, lotSize, entry, exit,
          exitDate, exitTime: product==='NRML'?'09:40':fromMin(Math.min(tmin+hold, 15*60+25)), spot:Math.round(sp*100)/100, product,
          source:t.style, charges, hedged:false });
      }
      // occasionally a 5th trade over the limit for B
      if(t.id==='TR-002' && R()<.15){ const last=trades[trades.length-1]; for(let k=0;k<Math.max(0,rl.maxTradesDay+1-n);k++){ const c={...last,id:uid('T'),time:fromMin(toMin(last.time)+15)}; trades.push(c);} }
    });
  });
  const groups = [
    {id:'G-1',name:'RA Group A',accounts:['AC-01','AC-02','AC-03','AC-04']},
    {id:'G-2',name:'Dealer — Gaurav',accounts:['AC-01','AC-05','AC-06']},
    {id:'G-3',name:'Trader A — all',accounts:['AC-01','AC-02','AC-07']},
  ];
  return {v:1, settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), traders, accounts, rules, ruleLog, trades, groups};
}
function nextTradingDay(d,days){ const i=days.indexOf(d); return days[i+1]||addDays(d,1); }

// ---------- store ----------
const KEY='tts_state_v1';
let S, ROLE='admin', USER='admin', LIVE=false, TOKEN=null, STATUS={}, USERS=[];
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); S.settings={...DEFAULT_SETTINGS,...S.settings}; return; } }catch(e){} S=buildDemo(); }
function save(){ if(!LIVE){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} } invalidate(); }
function canEdit(){ return ROLE==='admin'; }

// ---------- API adapter (live deployment) ----------
const API = {
  async req(path, opt={}){
    const r = await fetch('/api'+path, {...opt, headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}),...(opt.headers||{})}});
    if(r.status===401 && path!=='/login'){ logout(); throw new Error('Signed out — please sign in again'); }
    if(!r.ok){ let m=r.status+''; try{ m=(await r.json()).detail||m; }catch(e){} throw new Error(m); }
    return r.json();
  },
  async syncAll(){
    const [traders,accounts,rules,trades,groups,settings,ruleLog,status] = await Promise.all([
      this.req('/traders'), this.req('/accounts'), this.req('/rules'), this.req('/trades?from='+addDays(TODAY,-180)), this.req('/groups'),
      this.req('/settings'), this.req('/rulelog'), this.req('/status')]);
    Object.assign(S,{traders,accounts,rules,trades,groups,ruleLog,settings:{...DEFAULT_SETTINGS,...settings,dataSource:'live'}}); STATUS=status;
    if(ROLE==='admin'){ try{ USERS=await this.req('/users'); }catch(e){} }
    invalidate();
  },
  saveTrader:t=>API.req('/traders/'+encodeURIComponent(t.id),{method:'PUT',body:JSON.stringify(t)}),
  saveAccount:a=>API.req('/accounts/'+encodeURIComponent(a.id),{method:'PUT',body:JSON.stringify(a)}),
  saveRules:(id,r,change)=>API.req('/rules/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({rules:r,change})}),
  importTrades:rows=>API.req('/trades/import',{method:'POST',body:JSON.stringify(rows)}),
  deleteTrade:id=>API.req('/trades/'+encodeURIComponent(id),{method:'DELETE'}),
  deleteTradesBulk:ids=>API.req('/trades/delete-bulk',{method:'POST',body:JSON.stringify({ids})}),
  unlinkAccount:id=>API.req('/accounts/'+encodeURIComponent(id)+'/unlink',{method:'POST'}),
  saveAccountToken:(id,token)=>API.req('/accounts/'+encodeURIComponent(id)+'/token',{method:'POST',body:JSON.stringify({token})}),
  saveGroup:g=>API.req('/groups/'+encodeURIComponent(g.id),{method:'PUT',body:JSON.stringify(g)}),
  deleteGroup:id=>API.req('/groups/'+encodeURIComponent(id),{method:'DELETE'}),
};
// In live mode: send the change to the server, then reload everything from it
async function liveCall(fn){ if(!LIVE) return; try{ await fn(); await API.syncAll(); render(); }catch(e){ toast('Server: '+e.message); } }
async function detectLive(){
  if(!/^https?:$/.test(location.protocol)) return false;
  try{ const c=new AbortController(); setTimeout(()=>c.abort(),2500); const r=await fetch('/api/health',{signal:c.signal}); if(!r.ok) return false; const j=await r.json(); return j.mode==='live'; }catch(e){ return false; }
}

// ---------- core calculations ----------
function tradePnl(t){ const dir = t.side==='SELL'?-1:1; return (t.exit - t.entry)*t.lots*t.lotSize*dir - (t.charges||0); }
function grossPnl(t){ const dir = t.side==='SELL'?-1:1; return (t.exit - t.entry)*t.lots*t.lotSize*dir; }
function moneyness(t, step){ // +n = n strikes ITM, -n = n strikes OTM, 0 = ATM
  if(!t.spot) return {atm:null,d:NaN};
  const atm = Math.round(t.spot/step)*step;
  const d = (t.opt==='CE' ? (atm - t.strike) : (t.strike - atm))/step;
  return {atm, d:Math.round(d)};
}
function mLabel(d){ if(isNaN(d)) return 'spot n/a'; return d===0?'ATM': d>0? d+' ITM' : (-d)+' OTM'; }
function expectedStrike(t, r, step){ if(!t.spot) return '—'; const atm=Math.round(t.spot/step)*step; const n = r.strikeMode==='ATM'?0:r.strikeDist; const sign = r.strikeMode==='ITM'?1:(r.strikeMode==='OTM'?-1:0); return t.opt==='CE'? atm - sign*n*step : atm + sign*n*step; }

// The rule checker: compares each trade with the trader's own rules
function checkAll(){
  const step=S.settings.strikeStep, flags=[], byTrade={};
  const groups = {};
  S.trades.forEach(t=>{ (groups[t.trader+'|'+t.date] ||= []).push(t); });
  Object.values(groups).forEach(list=>{
    list.sort((a,b)=>a.time.localeCompare(b.time));
    const r = S.rules[list[0].trader] || DEFAULT_RULES;
    let dayPnl=0, stopHit=false;
    list.forEach((t,i)=>{
      const f=[]; const add=(rule,did,level)=>f.push({rule,did,level});
      if(r.instrument!=='ANY' && t.symbol!==r.instrument) add('Instrument: '+r.instrument+' only', 'Traded '+t.symbol, 'High');
      if(r.strikeMode!=='ANY' && t.spot){
        const m=moneyness(t,step), want = r.strikeMode==='ATM'?0:(r.strikeMode==='ITM'?r.strikeDist:-r.strikeDist);
        if(m.d!==want) add('Strike: '+(r.strikeMode==='ATM'?'ATM':r.strikeDist+' '+r.strikeMode)+' only',
          `Bought ${t.strike} ${t.opt} = ${mLabel(m.d)} (spot ${Math.round(t.spot).toLocaleString('en-IN')}, right strike ${expectedStrike(t,r,step)} ${t.opt})`, 'High');
      }
      if(r.side!=='ANY' && t.side!==r.side) add(r.side==='BUY'?'Option buying only':'Option selling only', t.side+' trade', 'High');
      if(r.product==='MIS' && (t.product==='NRML' || t.exitDate!==t.date)) add('Intraday only', 'Carried position overnight (exit '+fmtDate(t.exitDate)+')', 'High');
      if(r.timeFrom && toMin(t.time)<toMin(r.timeFrom)) add('Entry from '+r.timeFrom, 'Entry at '+t.time, 'Medium');
      if(r.timeTo && toMin(t.time)>toMin(r.timeTo)) add('Entry till '+r.timeTo, 'New entry at '+t.time, 'Medium');
      if(r.maxTradesDay && i>=r.maxTradesDay) add('Max '+r.maxTradesDay+' trades / day', 'Took trade no. '+(i+1), 'Medium');
      if(r.maxLots && t.lots>r.maxLots) add('Max '+r.maxLots+' lots / trade', 'Took '+t.lots+' lots', 'Medium');
      const g=grossPnl(t);
      if(r.slPerLot && g<0 && -g/t.lots > r.slPerLot) add('SL max '+inr(r.slPerLot)+' / lot', 'Lost '+inr(-g/t.lots)+' per lot', 'High');
      if(r.dailyLoss && stopHit) add('Stop after '+inr(r.dailyLoss)+' day loss', 'Kept trading after loss limit hit', 'High');
      if(r.source!=='ANY' && t.source!==r.source) add(r.source+' trades only', 'Trade placed '+t.source, 'Low');
      if(r.hedge && !t.hedged) add('Hedge required', 'No hedge leg', 'Medium');
      if(r.expiry!=='ANY' && t.expiryType && t.expiryType!==r.expiry) add(r.expiry+' expiry only', 'Traded '+t.expiryType+' expiry', 'Low');
      dayPnl += tradePnl(t); if(r.dailyLoss && dayPnl <= -r.dailyLoss) stopHit=true;
      byTrade[t.id]=f; f.forEach(x=>flags.push({...x, trade:t}));
    });
  });
  flags.sort((a,b)=> (b.trade.date+b.trade.time).localeCompare(a.trade.date+a.trade.time));
  return {flags, byTrade};
}
let _chk=null; function chk(){ return _chk ||= checkAll(); }
function invalidate(){ _chk=null; }

function metrics(trades, capital){
  const T=[...trades].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const {byTrade}=chk();
  const pn=T.map(tradePnl), wins=pn.filter(x=>x>0), loss=pn.filter(x=>x<=0);
  const sw=wins.reduce((a,b)=>a+b,0), sl=-loss.reduce((a,b)=>a+b,0);
  const days={}; T.forEach((t,i)=>{ days[t.date]=(days[t.date]||0)+pn[i]; });
  const dk=Object.keys(days).sort();
  let cum=0,peak=0,mdd=0,mddDay=null; const series=[], dd=[];
  dk.forEach(d=>{ cum+=days[d]; peak=Math.max(peak,cum); const x=cum-peak; if(x<mdd){mdd=x;mddDay=d;} series.push(cum); dd.push(x); });
  let streak=0,maxStreak=0; pn.forEach(x=>{ if(x<=0){streak++;maxStreak=Math.max(maxStreak,streak);} else streak=0; });
  const holds=T.filter(t=>t.exitDate===t.date&&t.exitTime).map(t=>toMin(t.exitTime)-toMin(t.time));
  const clean=T.filter(t=>!(byTrade[t.id]||[]).length).length;
  const high=T.reduce((a,t)=>a+(byTrade[t.id]||[]).filter(f=>f.level==='High').length,0);
  const flagsN=T.reduce((a,t)=>a+(byTrade[t.id]||[]).length,0);
  const dv=dk.map(d=>days[d]);
  return {
    n:T.length, total:pn.reduce((a,b)=>a+b,0), accuracy: T.length? wins.length/T.length*100 : NaN,
    rr: (wins.length&&loss.length)? (sw/wins.length)/(sl/loss.length) : NaN,
    pf: sl? sw/sl : (sw?Infinity:NaN), mdd:-mdd, mddPct: capital? -mdd/capital*100 : NaN, mddDay,
    tpd: dk.length? T.length/dk.length : 0, days:dk.length,
    intraday: T.length? T.filter(t=>t.product!=='NRML'&&t.exitDate===t.date).length/T.length*100 : NaN,
    manual: T.length? T.filter(t=>t.source==='Manual').length/T.length*100 : NaN,
    ruleFollow: T.length? clean/T.length*100 : NaN, high, flagsN,
    best: dv.length? Math.max(...dv):0, worst: dv.length? Math.min(...dv):0,
    bestDay: dk[dv.indexOf(Math.max(...dv))], worstDay: dk[dv.indexOf(Math.min(...dv))],
    streak:maxStreak, hold: holds.length? holds.reduce((a,b)=>a+b,0)/holds.length : NaN,
    charges: T.reduce((a,t)=>a+(t.charges||0),0), dayKeys:dk, dayVals:dv, series, dd, grossWin:sw, grossLoss:sl
  };
}
function trader(id){ return S.traders.find(t=>t.id===id); }
function account(id){ return S.accounts.find(a=>a.id===id); }
function tradesOf(id, from, to){ return S.trades.filter(t=>t.trader===id && (!from||t.date>=from) && (!to||t.date<=to)); }
function testWindow(t){ const end = nthTradingDay(t.start, S.settings.testDays + (t.extended? S.settings.extendDays:0)); return {from:t.start, to:end}; }
function testDay(t){ return Math.min(tradingDaysBetween(t.start, TODAY), S.settings.testDays + (t.extended?S.settings.extendDays:0)); }

function scorecard(t){
  const w=testWindow(t), m=metrics(tradesOf(t.id,w.from,w.to), t.testCapital), P=S.settings.pass;
  const checks=[
    {k:'Rule-follow score', must:'≥ '+P.ruleFollow+'%', val:pct(m.ruleFollow,1), ok:m.ruleFollow>=P.ruleFollow},
    {k:'High red flags', must:'≤ '+P.highFlags, val:m.high, ok:m.high<=P.highFlags},
    {k:'Max drawdown', must:'≤ '+P.maxDDpct+'% of capital', val:pct(m.mddPct,1)+' ('+inr(m.mdd)+')', ok:m.mddPct<=P.maxDDpct},
    {k:'Accuracy', must:'≥ '+P.accuracy+'%', val:pct(m.accuracy,1), ok:m.accuracy>=P.accuracy},
    {k:'Risk : Reward', must:'≥ 1 : '+P.rr, val:isFinite(m.rr)?'1 : '+m.rr.toFixed(2):'—', ok:m.rr>=P.rr},
    {k:'Profit factor', must:'≥ '+P.pf, val:isFinite(m.pf)?m.pf.toFixed(2):'—', ok:m.pf>=P.pf},
  ];
  const miss=checks.filter(c=>!c.ok).length, day=testDay(t), total=S.settings.testDays+(t.extended?S.settings.extendDays:0);
  const done = day>=total;
  const result = miss===0?'Pass':(miss<=2?'Watch':'Fail');
  return {m, checks, miss, result, done, day, total, w};
}

function calendar(m){
  if(!m.dayKeys.length) return '<span class="muted">No trades</span>';
  const map={}; m.dayKeys.forEach((d,i)=>map[d]=m.dayVals[i]); const mx=Math.max(...m.dayVals.map(Math.abs),1);
  const first=m.dayKeys[0], last=m.dayKeys[m.dayKeys.length-1];
  let s=first; while(new Date(s+'T00:00:00Z').getUTCDay()!==1) s=addDays(s,-1);
  let html='<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="hd">${d}</div>`).join('');
  for(; s<=last; s=addDays(s,1)){ const v=map[s]; const a=v==null?0:Math.min(1,Math.abs(v)/mx)*.8+.15;
    html+= v==null? `<div style="background:#0f1730;color:#3d4a6b">${s.slice(8)}</div>` : `<div title="${s}: ${inr(v)}" style="background:${v>=0?`rgba(34,195,142,${a})`:`rgba(255,93,108,${a})`}"><b>${s.slice(8)}</b>${inrS(v).replace('₹','')}</div>`; }
  return html+'</div>';
}
function drawReportCharts(m){

  const g=$('#cGrowth'), d=$('#cDD');
  if(g) charts.push(new Chart(g,{type:'line',data:{labels,datasets:[{data:m.series,borderColor:'#22c38e',backgroundColor:'rgba(34,195,142,.12)',fill:true,tension:.25,pointRadius:0,borderWidth:2}]},options:base}));
  if(d) charts.push(new Chart(d,{type:'line',data:{labels,datasets:[{data:m.dd,borderColor:'#ff5d6c',backgroundColor:'rgba(255,93,108,.18)',fill:true,tension:.2,pointRadius:0,borderWidth:1.5}]},options:base}));
}

function delTrade(id){
  const t=S.trades.find(x=>x.id===id);
  if(!confirm('Delete this trade?')) return;
  S.trades=S.trades.filter(x=>x.id!==id);
  SELECTED_TRADE_IDS.delete(id);
  save(); liveCall(()=>API.deleteTrade(id)); closeModal(); render(); toast('Trade deleted');
}

let SELECTED_TRADE_IDS = new Set();
function toggleSelectAllTrades(checked){
  const chks = document.querySelectorAll('.trade-chk');
  chks.forEach(c => {
    c.checked = checked;
    if(checked) SELECTED_TRADE_IDS.add(c.value);
    else SELECTED_TRADE_IDS.delete(c.value);
  });
  updateDelTradesBtn();
}
function onTradeChkChange(el){
  if(el.checked) SELECTED_TRADE_IDS.add(el.value);
  else SELECTED_TRADE_IDS.delete(el.value);
  const allChks = document.querySelectorAll('.trade-chk');
  const chkAll = document.getElementById('chkAllTrades');
  if(chkAll) chkAll.checked = allChks.length > 0 && document.querySelectorAll('.trade-chk:checked').length === allChks.length;
  updateDelTradesBtn();
}
function updateDelTradesBtn(){
  const btn = document.getElementById('btnDelTrades');
  const cnt = document.getElementById('selTradesCount');
  if(!btn) return;
  const count = SELECTED_TRADE_IDS.size;
  if(count > 0){
    btn.style.display = 'inline-block';
    if(cnt) cnt.textContent = count;
  } else {
    btn.style.display = 'none';
  }
}
async function deleteSelectedTrades(){
  const ids = Array.from(SELECTED_TRADE_IDS);
  if(!ids.length) return;
  if(!confirm(`Delete ${ids.length} selected trade(s)?`)) return;
  S.trades = S.trades.filter(x => !ids.includes(x.id));
  SELECTED_TRADE_IDS.clear();
  save();
  if(LIVE){
    try {
      await API.deleteTradesBulk(ids);
      await API.syncAll();
    } catch(e){ toast('Server: ' + e.message); }
  }
  render();
  toast(`${ids.length} trade(s) deleted`);
}
async function unlinkAccount(id){
  const a = account(id);
  if(!confirm(`Disconnect ${a ? a.name : id} from Zebu?`)) return;
  try {
    if(LIVE) await API.unlinkAccount(id);
    else { const o = account(id); if(o) o.link = 'Not linked'; save(); }
    toast('Account disconnected');
    if(LIVE) await API.syncAll();
    render();
  } catch(e) {
    toast('Unlink error: ' + e.message);
  }
}

   <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">

function normalizeHeader(h){
  const clean = String(h||'').toLowerCase().replace(/[^a-z0-9]/g, '');
  for(const [canonical, aliases] of Object.entries(ALIASES)){
    if(canonical.toLowerCase() === clean || aliases.includes(clean)) return canonical;
  }
  return clean;
}

function copyTemplate(){ const s=CSV_COLS.join(',')+'\n2026-11-13,10:42,TR-001,AC-01,BANKNIFTY,52000,CE,Weekly,BUY,1,30,310,295,2026-11-13,11:05,51800,MIS,Manual,62,false'; navigator.clipboard.writeText(s).then(()=>toast('Template copied'),()=>{ $('#csvText').value=s; }); }

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  if(lines.length < 2) return [];
  const split = l => {
    const out = []; let cur = '', q = false;
    for(const c of l){
      if(c === '"') q = !q;
      else if(c === ',' && !q){ out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(x => x.trim().replace(/^["']|["']$/g, ''));
  };
  const rawHeaders = split(lines[0]);
  const headers = rawHeaders.map(normalizeHeader);
  return lines.slice(1).map(l => {
    const vals = split(l);
    const obj = {};
    headers.forEach((k, i) => { if(k) obj[k] = vals[i] ?? ''; });
    return obj;
  });
}

function doImport(){
  const rows = parseCSV(val('csvText') || '');
  if(!rows.length){ toast('Nothing to import: please select an Excel/CSV file or paste CSV text'); return; }
  const defTrader = S.traders[0]?.id || 'TR-001';
  const defAccount = S.accounts[0]?.id || 'AC-01';

  const out = [];
  for(const r of rows){
    let d = (r.date || TODAY).trim();
    let tm = (r.time || '10:00').trim();
    if(d.includes(' ')){
      const parts = d.split(' ');
      d = parts[0];
      if(!r.time && parts[1]) tm = parts[1].slice(0, 5);
    }
    if(/^\d{1,2}[-\/]\d{1,2}[-\/]\d{4}$/.test(d)){
      const dp = d.split(/[-\/]/);
      d = `${dp[2]}-${dp[1].padStart(2,'0')}-${dp[0].padStart(2,'0')}`;
    }

    let sym = (r.symbol || 'BANKNIFTY').trim().toUpperCase();
    let stk = +r.strike || 0;
    let opt = (r.opt || 'CE').trim().toUpperCase();
    if(!stk && sym){
      const m = sym.match(/(\d{4,6})(CE|PE)/);
      if(m){ stk = +m[1]; opt = m[2]; }
    }

    const lotSize = +r.lotSize || S.settings.lotSize || 30;
    let lots = +r.lots || 0;
    if(!lots && +r.qty){ lots = Math.max(1, Math.round(+r.qty / lotSize)); }
    if(!lots) lots = 1;

    let side = (r.side || 'BUY').trim().toUpperCase();
    if(side === 'B') side = 'BUY';
    if(side === 'S') side = 'SELL';

    const t = {
      id: uid('T'),
      date: d,
      time: tm.slice(0, 5) || '10:00',
      trader: (r.trader || defTrader).trim(),
      account: (r.account || defAccount).trim(),
      symbol: sym,
      strike: stk,
      opt: opt,
      expiryType: r.expiryType || '',
      side: side,
      lots: lots,
      lotSize: lotSize,
      qty: lots * lotSize,
      entry: +r.entry || +r.price || 100,
      exit: +r.exit || +r.entry || 100,
      exitDate: r.exitDate || d,
      exitTime: r.exitTime || tm,
      spot: +r.spot || stk || 0,
      product: (r.product || 'MIS').trim().toUpperCase(),
      source: (r.source || 'Manual').trim(),
      charges: +r.charges || 0,
      hedged: String(r.hedged).toLowerCase() === 'true',
      origin: 'import'
    };
    out.push(t);
  }

  if(!out.length){ toast('Could not parse any trades from the provided data'); return; }
  S.trades.push(...out);
  save();
  liveCall(() => API.importTrades(out));
  closeModal();
  render();
  const nf = out.filter(t => chk().byTrade[t.id]?.length).length;
  toast(`Imported ${out.length} trades · ${nf} with red flags`);
}

  on('gSel','change',e=>{ SEL.group=e.target.value; render(); });
  [['cSort','sort'],['cStatus','status'],['cStyle','style'],['cHold','hold']].forEach(([id,k])=>on(id,'change',e=>{ SEL.cmp[k]=e.target.value; render(); }));
}
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(V[h] && h!==VIEW){ VIEW=h; render(); } });
try{ const h0=location.hash.slice(1); if(V[h0]) VIEW=h0; }catch(e){}
let WS_CLIENT = null;
function initDashboardWebSocket(){
  if(!LIVE || !USER || WS_CLIENT) return;
  try {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${location.host}/api/ws`;
    WS_CLIENT = new WebSocket(wsUrl);
    WS_CLIENT.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if(msg.type === 'trades_updated'){
          refreshLive();
        }
      } catch(e){}
    };
    WS_CLIENT.onclose = () => {
      WS_CLIENT = null;
      setTimeout(initDashboardWebSocket, 5000);
    };
    WS_CLIENT.onerror = () => {
      if(WS_CLIENT) WS_CLIENT.close();
    };
  } catch(e){}
}

try {
  const bc = new BroadcastChannel('tts_auth');
  bc.onmessage = (ev) => {
    if(ev.data && ev.data.type === 'zebu_linked'){
      toast('Zebu account linked successfully!');
      closeModal();
      refreshLive();
    }
  };
} catch(e) {}

(async function init(){
  $('#root').innerHTML='<div class="login"><div class="muted">Loading…</div></div>';
  LIVE = await detectLive();
  if(LIVE){
    S={settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),traders:[],accounts:[],rules:{},ruleLog:[],trades:[],groups:[]}; USER=null;
    try{
      const u=JSON.parse(localStorage.getItem('tts_live')||sessionStorage.getItem('tts_live')||'null');
      if(u){ TOKEN=u.TOKEN; USER=u.USER; ROLE=u.ROLE; await API.syncAll(); initDashboardWebSocket(); }
    }catch(e){ USER=null; TOKEN=null; }
    setInterval(()=>{ if(USER && !$('#mbg').classList.contains('on') && document.visibilityState!=='hidden' && !document.activeElement?.matches?.('input,select,textarea')) refreshLive(); }, 30000);
  } else {
    load();
    try{
      const u=JSON.parse(localStorage.getItem('tts_user')||sessionStorage.getItem('tts_user')||'null');
      if(u){ USER=u.USER; ROLE=u.ROLE; } else USER=null;
    }catch(e){ USER='admin'; }
  }
  render();
  const urlParams = new URLSearchParams(location.search);
  const codeVal = urlParams.get('code');
  if(codeVal){
    try {
      toast('Exchanging Zebu login code...');
      await fetch('/auth/zebu/callback?code=' + encodeURIComponent(codeVal) + '&state=' + encodeURIComponent(urlParams.get('state')||''));
      toast('Account linked to Zebu successfully!');
      history.replaceState(null, '', location.pathname + (location.hash || '#traders'));
      if(LIVE) await API.syncAll();
      render();
    } catch(e) {
      toast('Link exchange error: ' + e.message);
    }
  } else if(location.search.includes('linked=true')){
    toast('Account linked to Zebu successfully!');
    history.replaceState(null, '', location.pathname + (location.hash || '#traders'));
  }
})();
</script>
